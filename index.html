<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Kê Kho iOS</title>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #f4f4f9; color: #333; margin: 0; }
        h2 { font-size: 1.2rem; text-align: center; color: #007AFF; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn { background: #007AFF; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-green { background: #34C759; }
        .btn-red { background: #FF3B30; }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; width: auto; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-top: 5px; }
        
        #camModal, #previewModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 92%; max-width: 400px; padding: 15px; border-radius: 12px; text-align: center; box-sizing: border-box; }
        video, img { width: 100%; height: 240px; background: black; border-radius: 8px; object-fit: contain; }
        .detected-box { background: #eef7ee; color: #2e7d32; padding: 8px; border-radius: 6px; font-weight: bold; margin: 10px 0; font-size: 0.95rem; border: 1px dashed #2e7d32; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 8px; font-size: 0.85rem; text-align: left; }
        th { background: #007AFF; color: white; }
    </style>
</head>
<body>

    <h2>📦 Kiểm Kê Kho iOS</h2>

    <div class="card">
        <button class="btn" onclick="openCamera()">Cam_on (Bật Camera)</button>
        <button class="btn btn-green" style="margin-top: 10px;" onclick="exportCSV()">Xuất CSV</button>
        
        <div style="margin-top: 15px;">
            <label style="font-size: 0.85rem; font-weight: bold;">Nhập mã thủ công (khi tem mờ):</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="manualInput" placeholder="Mã vạch / Serial...">
                <button class="btn btn-green btn-sm" onclick="addManual()">Thêm</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 0.9rem;">Danh Sách Đã Quét (<span id="count">0</span>)</strong>
            <button class="btn btn-red btn-sm" onclick="clearAll()">Xóa tất cả</button>
        </div>
        <table id="resultTable">
            <thead>
                <tr><th>STT</th><th>Barcode</th><th>Thời gian</th><th>Ảnh</th><th>Xóa</th></tr>
            </thead>
            <tbody>
                <tr><td colspan="5" style="text-align: center; color: #777;">Chưa có dữ liệu kiểm kê</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Popup Camera -->
    <div id="camModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:1rem;">Chĩa Camera vào Mã Vạch</h3>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div class="detected-box" id="detectedStatus">Đang tìm mã vạch...</div>

            <div style="margin: 10px 0; text-align: left; font-size: 0.85rem;">
                <label><input type="checkbox" id="chkPic" checked> Chụp & Xem ảnh (Pic)</label>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-green" onclick="saveCurrentScan()">Scan (Lưu Dữ Liệu)</button>
                <button class="btn btn-red" onclick="closeCamera()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Popup Xem trước ảnh vừa chụp cho iOS -->
    <div id="previewModal">
        <div class="modal-content">
            <h3 id="previewTitle" style="margin-top:0; font-size:0.95rem; color:#007AFF;">Ảnh chụp sản phẩm</h3>
            <img id="previewImg" src="" alt="Captured Image">
            <p style="font-size: 0.75rem; color: #666; margin: 8px 0;">Mẹo: Chạm giữ vào ảnh phía trên và chọn "Lưu hình ảnh" để lưu về iPhone.</p>
            <button class="btn" onclick="closePreview()">Đóng & Tiếp tục</button>
        </div>
    </div>

    <script>
        let scannedData = [];
        let codeCounters = {};
        let codeReader = null;
        let currentDetectedCode = "";

        async function openCamera() {
            document.getElementById("camModal").style.display = "flex";
            document.getElementById("detectedStatus").innerText = "Đang tìm mã vạch...";
            document.getElementById("detectedStatus").style.color = "#888";
            currentDetectedCode = "";

            try {
                codeReader = new ZXing.BrowserMultiFormatReader();
                codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                    if (result) {
                        currentDetectedCode = result.text;
                        document.getElementById("detectedStatus").innerText = "Đã tìm thấy: " + currentDetectedCode;
                        document.getElementById("detectedStatus").style.color = "#2e7d32";
                        if (navigator.vibrate) navigator.vibrate(100);
                    }
                });
            } catch (e) {
                alert("Không thể khởi động Camera!");
                closeCamera();
            }
        }

        function closeCamera() {
            if (codeReader) {
                codeReader.reset();
                codeReader = null;
            }
            document.getElementById("camModal").style.display = "none";
        }

        function saveCurrentScan() {
            let finalCode = currentDetectedCode;
            if (!finalCode) {
                finalCode = prompt("Chưa bắt tự động được mã. Nhập thủ công mã vạch:", "");
            }

            if (!finalCode || finalCode.trim() === "") {
                alert("Vui lòng quét đúng mã vạch hoặc nhập mã!");
                return;
            }

            finalCode = finalCode.trim();

            if (!codeCounters[finalCode]) {
                codeCounters[finalCode] = 1;
            } else {
                codeCounters[finalCode]++;
            }
            let seq = String(codeCounters[finalCode]).padStart(3, '0');
            let imgName = `${finalCode}_${seq}.png`;

            let isPicChecked = document.getElementById("chkPic").checked;
            let timeNow = new Date().toLocaleTimeString();
            
            closeCamera();

            if (isPicChecked) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("canvas");
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                let dataURL = canvas.toDataURL("image/png");
                
                // Hiển thị popup chứa thẻ <img> để người dùng bấm lưu thủ công trên iOS
                document.getElementById("previewTitle").innerText = "Ảnh: " + imgName;
                document.getElementById("previewImg").src = dataURL;
                document.getElementById("previewModal").style.display = "flex";
            }

            scannedData.unshift({ code: finalCode, time: timeNow, img: isPicChecked ? imgName : "Không" });
            updateTable();
        }

        function closePreview() {
            document.getElementById("previewModal").style.display = "none";
        }

        function addManual() {
            let val = document.getElementById("manualInput").value.trim();
            if(!val) { alert("Vui lòng nhập mã!"); return; }
            let timeNow = new Date().toLocaleTimeString();
            scannedData.unshift({ code: val, time: timeNow, img: "Nhập tay" });
            document.getElementById("manualInput").value = "";
            updateTable();
        }

        function deleteItem(index) {
            scannedData.splice(index, 1);
            updateTable();
        }

        function clearAll() {
            if(confirm("Xóa toàn bộ danh sách?")) {
                scannedData = [];
                codeCounters = {};
                updateTable();
            }
        }

        function updateTable() {
            let tbody = document.querySelector("#resultTable tbody");
            if (scannedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #777;">Chưa có dữ liệu kiểm kê</td></tr>`;
                document.getElementById("count").innerText = 0;
                return;
            }
            tbody.innerHTML = "";
            scannedData.forEach((item, index) => {
                let row = tbody.insertRow();
                row.insertCell(0).innerText = scannedData.length - index;
                row.insertCell(1).innerText = item.code;
                row.insertCell(2).innerText = item.time;
                row.insertCell(3).innerText = item.img;
                let cellAction = row.insertCell(4);
                cellAction.innerHTML = `<button class="btn btn-red btn-sm" onclick="deleteItem(${index})">Xóa</button>`;
            });
            document.getElementById("count").innerText = scannedData.length;
        }

        function exportCSV() {
            if (scannedData.length === 0) { alert("Chưa có dữ liệu!"); return; }
            let csv = "STT,Barcode,Thoi_Gian,Anh\n";
            scannedData.forEach((row, i) => {
                csv += `${scannedData.length - i},${row.code},${row.time},${row.img}\n`;
            });
            let blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "kiem_ke_kho_" + Date.now() + ".csv";
            link.click();
        }
    </script>
</body>
</html>
